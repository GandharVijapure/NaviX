<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Lost Persons – NaviX Control Room</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="admin-shell">
    <div id="navix-admin-sidebar"></div>
    <main class="admin-main">
      <div id="navix-admin-topbar"></div>
      <div class="navix-card p-3">
        <h6 class="fw-bold mb-3">Lost Person Reports</h6>
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead><tr><th>Photo</th><th>Name</th><th>Age/Gender</th><th>Last Seen</th><th>Contact</th><th>Status</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/pwa-register.js"></script>
  <script>
    NaviXAuth.requireRole("admin", "/admin/login");
    NaviXLayout.renderAdminShell("/admin/lost-persons", "Lost Persons");

    const STATUSES = ["missing", "possible_match", "found", "reunited"];

    async function load() {
      const people = await NaviXApi.get("/api/lost-persons");
      document.getElementById("rows").innerHTML = people
        .map((p) => {
          const opts = STATUSES.map((s) => `<option value="${s}" ${s === p.status ? "selected" : ""}>${s.replace("_", " ")}</option>`).join("");
          const photo = p.photo ? `<img src="${p.photo}" style="width:48px;height:48px;object-fit:cover;border-radius:8px;">` : "🧑";
          return `<tr>
            <td>${photo}</td>
            <td>${p.name}</td>
            <td>${p.age || "—"} / ${p.gender || "—"}</td>
            <td class="small">${p.last_seen_location || "—"}</td>
            <td class="small">${p.contact || "—"}</td>
            <td><select class="form-select form-select-sm status-select" data-id="${p.id}" style="min-height:34px; width:160px;">${opts}</select></td>
          </tr>`;
        })
        .join("");

      document.querySelectorAll(".status-select").forEach((sel) =>
        sel.addEventListener("change", async () => {
          await NaviXApi.put(`/api/lost-persons/${sel.getAttribute("data-id")}/status`, { status: sel.value });
        })
      );
    }

    NaviXSocket.on("lost_person_update", load);
    load();
  </script>
</body>
</html>
