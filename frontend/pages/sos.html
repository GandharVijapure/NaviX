<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>SOS – NaviX</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b2545" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="navix-navbar"></div>

  <div class="container py-4" style="max-width:560px;">
    <div id="sosForm">
      <h2 class="section-title" data-i18n="sos_title">Emergency Assistance</h2>
      <p class="text-navix-muted">Your location is sent automatically if you allow it. Help is on the way as soon as you send.</p>

      <label class="fw-bold mb-2 d-block" data-i18n="sos_select_type">Select emergency type</label>
      <div class="row g-2 mb-3" id="typeButtons">
        <div class="col-6"><button class="btn btn-navix-outline w-100 emergency-type" data-type="medical">🚑 Medical Emergency</button></div>
        <div class="col-6"><button class="btn btn-navix-outline w-100 emergency-type" data-type="police">👮 Police Assistance</button></div>
        <div class="col-6"><button class="btn btn-navix-outline w-100 emergency-type" data-type="lost_person">🔍 Lost Person</button></div>
        <div class="col-6"><button class="btn btn-navix-outline w-100 emergency-type" data-type="crowd">👥 Crowd Problem</button></div>
        <div class="col-12"><button class="btn btn-navix-outline w-100 emergency-type" data-type="other">❓ Other</button></div>
      </div>

      <label class="fw-bold mb-1" for="sosDescription">Optional short description</label>
      <textarea id="sosDescription" class="form-control mb-2" rows="3" placeholder="E.g. Near the water tank, elderly woman feeling unwell"></textarea>

      <div id="locStatus" class="text-navix-muted small mb-3">📍 Getting your location…</div>

      <button id="sendSosBtn" class="btn btn-navix-danger w-100" disabled data-i18n="sos_send">SEND SOS</button>
    </div>

    <div id="sosSuccess" style="display:none;">
      <div class="navix-card p-4 text-center">
        <div style="font-size:3rem;">✅</div>
        <h3 class="section-title mt-2" data-i18n="sos_sent">SOS Sent Successfully</h3>
        <p class="text-navix-muted">Emergency ID: <strong id="sosId"></strong></p>
        <div class="status-pill new mb-3" id="sosStatus">NEW</div>
        <p class="text-navix-muted small">Stay where you are if it's safe to do so. A volunteer will be assigned shortly.</p>
        <a href="/find-help" class="btn btn-navix-primary w-100 mt-2">Back to Find Help</a>
      </div>
    </div>
  </div>

  <div id="navix-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/geo.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/pwa-register.js"></script>
  <script>
    NaviXLayout.renderPublicNavbar("/alerts"); // no exact nav match; keep nav neutral
    NaviXLayout.renderFooter();

    let selectedType = null;
    let userLoc = null;

    document.getElementById("typeButtons").addEventListener("click", (e) => {
      const btn = e.target.closest(".emergency-type");
      if (!btn) return;
      document.querySelectorAll(".emergency-type").forEach((b) => b.classList.remove("btn-navix-danger"));
      document.querySelectorAll(".emergency-type").forEach((b) => b.classList.add("btn-navix-outline"));
      btn.classList.remove("btn-navix-outline");
      btn.classList.add("btn-navix-danger");
      selectedType = btn.getAttribute("data-type");
      updateSendButton();
    });

    function updateSendButton() {
      document.getElementById("sendSosBtn").disabled = !selectedType;
    }

    async function locate() {
      userLoc = await NaviXGeo.getCurrentPosition();
      document.getElementById("locStatus").textContent = `📍 Location ready (${userLoc.lat.toFixed(4)}, ${userLoc.lon.toFixed(4)})`;
    }

    document.getElementById("sendSosBtn").addEventListener("click", async () => {
      if (!selectedType) return;
      const btn = document.getElementById("sendSosBtn");
      btn.disabled = true;
      btn.textContent = "Sending…";
      try {
        const loc = userLoc || NaviXGeo.FALLBACK;
        const emergency = await NaviXApi.post("/api/emergencies", {
          type: selectedType,
          latitude: loc.lat,
          longitude: loc.lon,
          description: document.getElementById("sosDescription").value || null,
        });
        document.getElementById("sosForm").style.display = "none";
        document.getElementById("sosSuccess").style.display = "block";
        document.getElementById("sosId").textContent = `SOS-${emergency.id}`;
        renderStatus(emergency.status);

        NaviXSocket.on("emergency_updated", (data) => {
          if (data.id === emergency.id) renderStatus(data.status);
        });
      } catch (e) {
        alert("Could not send SOS: " + e.message + ". Please try again or find the nearest volunteer/police post in person.");
        btn.disabled = false;
        btn.textContent = "SEND SOS";
      }
    });

    function renderStatus(status) {
      const pill = document.getElementById("sosStatus");
      pill.textContent = status;
      pill.className = "status-pill mb-3 " + status.toLowerCase();
    }

    locate();
  </script>
</body>
</html>
