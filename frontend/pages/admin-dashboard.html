<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Control Room Dashboard – NaviX</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="admin-shell">
    <div id="navix-admin-sidebar"></div>
    <main class="admin-main">
      <div id="navix-admin-topbar"></div>

      <div class="row g-3 mb-3">
        <div class="col-6 col-md-4 col-xl-2"><a href="/admin/emergencies?quick=active" class="stat-card-link"><div class="stat-card danger"><div class="stat-value" id="statActiveSos">–</div><div class="stat-label">Active SOS</div></div></a></div>
        <div class="col-6 col-md-4 col-xl-2"><a href="/admin/emergencies?quick=critical" class="stat-card-link"><div class="stat-card danger"><div class="stat-value" id="statCriticalSos">–</div><div class="stat-label">Critical SOS</div></div></a></div>
        <div class="col-6 col-md-4 col-xl-2"><a href="/admin/volunteers" class="stat-card-link"><div class="stat-card success"><div class="stat-value" id="statVolunteers">–</div><div class="stat-label">Volunteers Online</div></div></a></div>
        <div class="col-6 col-md-4 col-xl-2"><a href="/admin/devices" class="stat-card-link"><div class="stat-card"><div class="stat-value" id="statDevices">–</div><div class="stat-label">Devices Online</div></div></a></div>
        <div class="col-6 col-md-4 col-xl-2"><a href="/admin/devices" class="stat-card-link"><div class="stat-card"><div class="stat-value" id="statLoraNodes">–</div><div class="stat-label">LoRa Nodes Online</div></div></a></div>
        <div class="col-6 col-md-4 col-xl-2"><a href="/admin/gateways" class="stat-card-link"><div class="stat-card"><div class="stat-value" id="statGateways">–</div><div class="stat-label">Gateways Online</div></div></a></div>
        <div class="col-6 col-md-4 col-xl-2"><a href="/admin/emergencies?quick=medical" class="stat-card-link"><div class="stat-card orange"><div class="stat-value" id="statMedical">–</div><div class="stat-label">Medical Cases</div></div></a></div>
        <div class="col-6 col-md-4 col-xl-2"><a href="/admin/lost-persons" class="stat-card-link"><div class="stat-card"><div class="stat-value" id="statMissing">–</div><div class="stat-label">Missing Reports</div></div></a></div>
        <div class="col-6 col-md-4 col-xl-2"><a href="/admin/announcements" class="stat-card-link"><div class="stat-card"><div class="stat-value" id="statAlerts">–</div><div class="stat-label">Active Alerts</div></div></a></div>
        <div class="col-6 col-md-4 col-xl-2"><a href="/admin/facilities" class="stat-card-link"><div class="stat-card success"><div class="stat-value" id="statOpenFacilities">–</div><div class="stat-label">Open Facilities</div></div></a></div>
      </div>

      <div class="navix-card p-2 mb-3">
        <div class="d-flex justify-content-between align-items-center px-2 pt-1">
          <h6 class="fw-bold mb-2">Live Map</h6>
          <div class="d-flex gap-2">
            <button id="simStartBtn" class="btn btn-sm btn-navix-primary" style="min-height:36px;" disabled title="Disabled by control-room operator — control room now reflects real submissions only">▶ Start NaviX Simulation</button>
            <button id="simStopBtn" class="btn btn-sm btn-navix-outline" style="min-height:36px;" disabled title="Disabled by control-room operator — control room now reflects real submissions only">⏸ Stop</button>
          </div>
        </div>
        <div id="map" class="navix-map"></div>
      </div>

      <div class="navix-card p-3">
        <h6 class="fw-bold mb-2">Active Emergencies</h6>
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead><tr><th>ID</th><th>Type</th><th>Reported</th><th>Status</th><th></th></tr></thead>
            <tbody id="emergencyRows"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/map.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/pwa-register.js"></script>
  <script>
    NaviXAuth.requireRole("admin", "/admin/login");
    NaviXLayout.renderAdminShell("/admin/dashboard", "Control Room Dashboard");

    let map;
    const markers = { volunteer: {}, emergency: {}, facility: {} };

    async function loadStats() {
      const stats = await NaviXApi.get("/api/admin/stats");
      document.getElementById("statActiveSos").textContent = stats.active_sos;
      document.getElementById("statCriticalSos").textContent = stats.critical_sos;
      document.getElementById("statVolunteers").textContent = stats.volunteers_online;
      document.getElementById("statDevices").textContent = stats.devices_online;
      document.getElementById("statLoraNodes").textContent = stats.lora_nodes_online;
      document.getElementById("statGateways").textContent = stats.gateways_online;
      document.getElementById("statMedical").textContent = stats.medical_cases;
      document.getElementById("statMissing").textContent = stats.missing_person_reports;
      document.getElementById("statAlerts").textContent = stats.active_alerts;
      document.getElementById("statOpenFacilities").textContent = stats.open_facilities;
    }

    function timeAgo(iso) {
      const diffMin = Math.max(0, Math.round((Date.now() - new Date(iso + "Z")) / 60000));
      return diffMin < 1 ? "just now" : `${diffMin} min ago`;
    }

    async function loadEmergencies() {
      const emergencies = await NaviXApi.get("/api/emergencies");
      const active = emergencies.filter((e) => e.status !== "RESOLVED");
      document.getElementById("emergencyRows").innerHTML = active
        .map(
          (e) => `<tr>
            <td>SOS-${e.id}</td><td class="text-capitalize">${e.type.replace("_", " ")}</td>
            <td>${timeAgo(e.created_at)}</td>
            <td><span class="status-pill ${e.status.toLowerCase()}">${e.status.replace("_", " ")}</span></td>
            <td><a href="/admin/emergencies?focus=${e.id}" class="btn btn-sm btn-navix-outline" style="min-height:32px;">Manage</a></td>
          </tr>`
        )
        .join("");

      // sync emergency markers
      Object.values(markers.emergency).forEach((m) => map.removeLayer(m));
      markers.emergency = {};
      active.forEach((e) => {
        markers.emergency[e.id] = L.marker([e.latitude, e.longitude], { icon: NaviXMap.divIcon("emergency") })
          .addTo(map)
          .bindPopup(`SOS-${e.id} · ${e.type}`);
      });
    }

    async function loadVolunteers() {
      const volunteers = await NaviXApi.get("/api/volunteers");
      volunteers.forEach((v) => upsertVolunteerMarker(v));
    }

    function upsertVolunteerMarker(v) {
      if (markers.volunteer[v.id]) map.removeLayer(markers.volunteer[v.id]);
      markers.volunteer[v.id] = L.marker([v.latitude, v.longitude], { icon: NaviXMap.divIcon("volunteer", { size: 28 }) })
        .addTo(map)
        .bindPopup(`${v.name} · <span class="status-pill ${v.status}">${v.status}</span>`);
    }

    async function loadFacilities() {
      const facilities = await NaviXApi.get("/api/facilities");
      facilities.forEach((f) => {
        L.marker([f.latitude, f.longitude], { icon: NaviXMap.divIcon(f.type, { size: 26 }) }).addTo(map).bindPopup(f.name);
      });
    }

    async function loadGateways() {
      const gateways = await NaviXApi.get("/api/gateways");
      gateways.forEach((g) => {
        if (g.latitude == null) return;
        L.marker([g.latitude, g.longitude], { icon: NaviXMap.divIcon("gateway", { size: 30 }) })
          .addTo(map)
          .bindPopup(`${g.name || g.gateway_id} · <span class="status-pill ${g.is_stale ? "offline" : g.status}">${g.is_stale ? "offline" : g.status}</span>`);
      });
    }

    async function refreshAll() {
      await Promise.all([loadStats(), loadEmergencies()]);
    }

    async function init() {
      map = NaviXMap.initMap("map", { lat: 18.5204, lon: 73.8567 }, 14);
      await Promise.all([loadFacilities(), loadVolunteers(), loadGateways()]);
      await refreshAll();
    }

    document.getElementById("simStartBtn").addEventListener("click", () => NaviXApi.post("/api/admin/simulation/start"));
    document.getElementById("simStopBtn").addEventListener("click", () => NaviXApi.post("/api/admin/simulation/stop"));

    NaviXSocket.on("sos_created", refreshAll);
    NaviXSocket.on("emergency_updated", refreshAll);
    NaviXSocket.on("volunteer_updated", (v) => { upsertVolunteerMarker(v); loadStats(); });
    NaviXSocket.on("device_updated", loadStats);
    NaviXSocket.on("gateway_updated", loadStats);

    init();
    setInterval(refreshAll, 20000);
  </script>
</body>
</html>
