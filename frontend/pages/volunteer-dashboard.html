<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Volunteer Dashboard – NaviX</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navix-navbar">
    <div class="container-fluid px-3 px-lg-4">
      <a class="navbar-brand" href="/volunteer/dashboard">NaviX<small>Volunteer</small></a>
      <button class="btn btn-sm btn-navix-outline" id="logoutBtn" style="min-height:38px;">Logout</button>
    </div>
  </nav>

  <div class="container py-3">
    <div class="row g-3">
      <div class="col-lg-4">
        <div class="navix-card p-3 mb-3">
          <h5 class="fw-bold mb-1" id="volName">–</h5>
          <div class="text-navix-muted small">Volunteer ID: <span id="volId">–</span></div>
          <div class="text-navix-muted small">Device ID: <span id="volDevice">–</span></div>
          <div class="text-navix-muted small">Zone: <span id="volZone">–</span></div>
          <div class="text-navix-muted small mb-2">Last communication: <span id="volLastSeen">–</span></div>

          <div class="mb-2">
            <label class="fw-bold small d-block mb-1">Status</label>
            <select id="statusSelect" class="form-select">
              <option value="available">Available</option>
              <option value="responding">Responding</option>
              <option value="busy">Busy</option>
              <option value="offline">Offline</option>
            </select>
          </div>

          <div class="d-flex justify-content-between small text-navix-muted">
            <span>🔋 Battery: <strong id="volBattery">–</strong>%</span>
            <span>📡 LoRa: <span class="status-pill online">Simulated</span></span>
          </div>
        </div>

        <div class="navix-card p-3">
          <h6 class="fw-bold mb-2">Nearby Emergency Requests</h6>
          <div id="nearbyEmergencies" class="d-flex flex-column gap-2"></div>
        </div>
      </div>

      <div class="col-lg-8">
        <div id="map" class="navix-map tall mb-3"></div>
        <div class="row g-3">
          <div class="col-md-6">
            <div class="navix-card p-3">
              <h6 class="fw-bold mb-2">Nearby Volunteers</h6>
              <div id="nearbyVolunteers" class="d-flex flex-column gap-1 small"></div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="navix-card p-3">
              <h6 class="fw-bold mb-2">Nearby Facilities</h6>
              <div id="nearbyFacilities" class="d-flex flex-column gap-1 small"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/map.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/pwa-register.js"></script>
  <script>
    const user = NaviXAuth.requireRole("volunteer", "/volunteer/login");
    document.getElementById("logoutBtn").addEventListener("click", () => NaviXAuth.logout("/volunteer/login"));

    let map, myMarker, volunteer;

    async function loadProfile() {
      volunteer = await NaviXApi.get("/api/volunteers/me");
      document.getElementById("volName").textContent = volunteer.name;
      document.getElementById("volId").textContent = "V-" + volunteer.id;
      document.getElementById("volDevice").textContent = volunteer.device_id || "Not linked";
      document.getElementById("volZone").textContent = volunteer.assigned_zone || "Unassigned";
      document.getElementById("volLastSeen").textContent = new Date(volunteer.last_seen + "Z").toLocaleTimeString();
      document.getElementById("volBattery").textContent = volunteer.battery_level;
      document.getElementById("statusSelect").value = volunteer.status;

      if (!map) {
        map = NaviXMap.initMap("map", { lat: volunteer.latitude, lon: volunteer.longitude }, 15);
      }
      if (myMarker) map.removeLayer(myMarker);
      myMarker = L.marker([volunteer.latitude, volunteer.longitude], { icon: NaviXMap.divIcon("volunteer") }).addTo(map).bindPopup("You");

      await Promise.all([loadNearbyEmergencies(), loadNearbyVolunteers(), loadNearbyFacilities()]);
    }

    async function loadNearbyEmergencies() {
      const emergencies = await NaviXApi.get("/api/emergencies?status=NEW");
      const el = document.getElementById("nearbyEmergencies");
      el.innerHTML = emergencies.length
        ? emergencies
            .map(
              (e) => `<div class="border rounded p-2">
                <div class="fw-bold small">SOS-${e.id} · ${e.type}</div>
                <div class="text-navix-muted small">${e.description || "No description"}</div>
              </div>`
            )
            .join("")
        : `<p class="text-navix-muted small mb-0">No new requests right now.</p>`;
    }

    async function loadNearbyVolunteers() {
      const list = await NaviXApi.get(`/api/volunteers/nearby?lat=${volunteer.latitude}&lon=${volunteer.longitude}&limit=6`);
      document.getElementById("nearbyVolunteers").innerHTML = list
        .map((v) => `<div>🧭 ${v.name} <span class="status-pill ${v.status}">${v.status}</span></div>`)
        .join("");
    }

    async function loadNearbyFacilities() {
      const list = await NaviXApi.get(`/api/facilities/nearby?lat=${volunteer.latitude}&lon=${volunteer.longitude}&limit=6`);
      document.getElementById("nearbyFacilities").innerHTML = list
        .map((f) => `<div>${NaviXMap.ICONS[f.type] || "📌"} ${f.name} — ${(f.distance_km * 1000).toFixed(0)} m</div>`)
        .join("");
    }

    document.getElementById("statusSelect").addEventListener("change", async (e) => {
      await NaviXApi.put("/api/volunteers/me/status", { status: e.target.value });
    });

    NaviXSocket.on("sos_created", loadNearbyEmergencies);
    NaviXSocket.on("volunteer_update", (v) => {
      if (v.id === volunteer?.id) return; // avoid clobbering our own edit-in-progress fields
      loadNearbyVolunteers();
    });

    loadProfile();
    setInterval(loadProfile, 15000);
  </script>
</body>
</html>
