<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Facilities – NaviX Control Room</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="admin-shell">
    <div id="navix-admin-sidebar"></div>
    <main class="admin-main">
      <div id="navix-admin-topbar"></div>

      <div class="row g-3">
        <div class="col-lg-7">
          <div class="navix-card p-3">
            <h6 class="fw-bold mb-3">All Facilities</h6>
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead><tr><th>Name</th><th>Type</th><th>Status</th><th>Hours</th><th></th></tr></thead>
                <tbody id="rows"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="navix-card p-3">
            <h6 class="fw-bold mb-3" id="formTitle">Add Facility</h6>
            <form id="facilityForm">
              <input type="hidden" name="id" />
              <div class="mb-2"><input name="name" required class="form-control" placeholder="Facility name" /></div>
              <div class="mb-2">
                <select name="type" required class="form-select">
                  <option value="medical">Medical</option>
                  <option value="police">Police</option>
                  <option value="water">Water</option>
                  <option value="food">Food</option>
                  <option value="help_centre">Help Centre</option>
                  <option value="ambulance">Ambulance</option>
                  <option value="toilet">Toilet</option>
                </select>
              </div>
              <div class="row g-2 mb-2">
                <div class="col-6"><input name="latitude" type="number" step="any" required class="form-control" placeholder="Latitude" /></div>
                <div class="col-6"><input name="longitude" type="number" step="any" required class="form-control" placeholder="Longitude" /></div>
              </div>
              <div class="row g-2 mb-2">
                <div class="col-6"><input name="opening_time" class="form-control" placeholder="Opens (HH:MM)" /></div>
                <div class="col-6"><input name="closing_time" class="form-control" placeholder="Closes (HH:MM)" /></div>
              </div>
              <div class="mb-2"><input name="contact" class="form-control" placeholder="Contact number" /></div>
              <div class="mb-2"><textarea name="description" class="form-control" rows="2" placeholder="Description"></textarea></div>
              <div class="mb-3">
                <select name="status" class="form-select">
                  <option value="open">Open</option>
                  <option value="closed">Closed</option>
                </select>
              </div>
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-navix-primary flex-grow-1">Save Facility</button>
                <button type="button" id="resetFormBtn" class="btn btn-navix-outline">Clear</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/pwa-register.js"></script>
  <script>
    NaviXAuth.requireRole("admin", "/admin/login");
    NaviXLayout.renderAdminShell("/admin/facilities", "Facilities");

    async function load() {
      const facilities = await NaviXApi.get("/api/facilities");
      document.getElementById("rows").innerHTML = facilities
        .map(
          (f) => `<tr>
            <td>${f.name}</td>
            <td class="text-capitalize">${f.type.replace("_", " ")}</td>
            <td><span class="status-pill ${f.status}">${f.status}</span></td>
            <td class="small">${f.opening_time || "--"}–${f.closing_time || "--"}</td>
            <td>
              <button class="btn btn-sm btn-navix-outline edit-btn" data-id="${f.id}" style="min-height:32px;">Edit</button>
              <button class="btn btn-sm btn-outline-danger delete-btn" data-id="${f.id}" style="min-height:32px;">Delete</button>
            </td>
          </tr>`
        )
        .join("");

      document.querySelectorAll(".edit-btn").forEach((btn) =>
        btn.addEventListener("click", () => {
          const f = facilities.find((x) => x.id === Number(btn.getAttribute("data-id")));
          const form = document.getElementById("facilityForm");
          form.id.value = f.id;
          form.name.value = f.name;
          form.type.value = f.type;
          form.latitude.value = f.latitude;
          form.longitude.value = f.longitude;
          form.opening_time.value = f.opening_time || "";
          form.closing_time.value = f.closing_time || "";
          form.contact.value = f.contact || "";
          form.description.value = f.description || "";
          form.status.value = f.status;
          document.getElementById("formTitle").textContent = `Edit Facility #${f.id}`;
          window.scrollTo({ top: 0, behavior: "smooth" });
        })
      );

      document.querySelectorAll(".delete-btn").forEach((btn) =>
        btn.addEventListener("click", async () => {
          if (!confirm("Remove this facility?")) return;
          await NaviXApi.delete(`/api/facilities/${btn.getAttribute("data-id")}`);
          load();
        })
      );
    }

    document.getElementById("resetFormBtn").addEventListener("click", () => {
      const form = document.getElementById("facilityForm");
      form.reset();
      form.id.value = "";
      document.getElementById("formTitle").textContent = "Add Facility";
    });

    document.getElementById("facilityForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const payload = {
        name: form.name.value,
        type: form.type.value,
        latitude: parseFloat(form.latitude.value),
        longitude: parseFloat(form.longitude.value),
        opening_time: form.opening_time.value || null,
        closing_time: form.closing_time.value || null,
        contact: form.contact.value || null,
        description: form.description.value || null,
        status: form.status.value,
      };
      if (form.id.value) {
        await NaviXApi.put(`/api/facilities/${form.id.value}`, payload);
      } else {
        await NaviXApi.post("/api/facilities", payload);
      }
      form.reset();
      form.id.value = "";
      document.getElementById("formTitle").textContent = "Add Facility";
      load();
    });

    NaviXSocket.on("facility_update", load);
    load();
  </script>
</body>
</html>
