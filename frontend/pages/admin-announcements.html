<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Announcements – NaviX Control Room</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="admin-shell">
    <div id="navix-admin-sidebar"></div>
    <main class="admin-main">
      <div id="navix-admin-topbar"></div>

      <div class="row g-3">
        <div class="col-lg-7">
          <div class="navix-card p-3">
            <h6 class="fw-bold mb-3">All Announcements</h6>
            <div id="list" class="d-flex flex-column gap-2"></div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="navix-card p-3">
            <h6 class="fw-bold mb-3">New Announcement</h6>
            <form id="form">
              <div class="mb-2"><input name="title" required class="form-control" placeholder="Title" /></div>
              <div class="mb-2"><textarea name="message" required class="form-control" rows="3" placeholder="Message"></textarea></div>
              <div class="row g-2 mb-2">
                <div class="col-6">
                  <select name="category" class="form-select">
                    <option value="general">General</option>
                    <option value="route_diversion">Route Diversion</option>
                    <option value="medical">Medical</option>
                    <option value="weather">Weather</option>
                    <option value="emergency">Emergency</option>
                    <option value="missing_person">Missing Person</option>
                    <option value="facility_update">Facility Update</option>
                  </select>
                </div>
                <div class="col-6">
                  <select name="priority" class="form-select">
                    <option value="normal">Normal</option>
                    <option value="important">Important</option>
                    <option value="critical">Critical</option>
                  </select>
                </div>
              </div>
              <div class="mb-3">
                <label class="fw-bold small d-block mb-1">Expires (optional)</label>
                <input name="expires_at" type="datetime-local" class="form-control" />
              </div>
              <button type="submit" class="btn btn-navix-primary w-100">Publish Announcement</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/pwa-register.js"></script>
  <script>
    NaviXAuth.requireRole("admin", "/admin/login");
    NaviXLayout.renderAdminShell("/admin/announcements", "Announcements");

    async function load() {
      const items = await NaviXApi.get("/api/announcements");
      document.getElementById("list").innerHTML = items
        .map(
          (a) => `<div class="navix-card p-3">
            <div class="d-flex justify-content-between">
              <strong>${a.title}</strong>
              <span class="badge ${a.priority === "critical" ? "bg-danger" : a.priority === "important" ? "bg-warning text-dark" : "bg-secondary"}">${a.priority}</span>
            </div>
            <div class="text-navix-muted small mb-1">${a.category.replace("_", " ")} · by ${a.created_by || "—"} · ${new Date(a.created_at + "Z").toLocaleString()}</div>
            <div class="small mb-2">${a.message}</div>
            <button class="btn btn-sm btn-outline-danger delete-btn" data-id="${a.id}" style="min-height:32px;">Delete / Expire</button>
          </div>`
        )
        .join("");

      document.querySelectorAll(".delete-btn").forEach((btn) =>
        btn.addEventListener("click", async () => {
          await NaviXApi.delete(`/api/announcements/${btn.getAttribute("data-id")}`);
          load();
        })
      );
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const payload = {
        title: form.title.value,
        message: form.message.value,
        category: form.category.value,
        priority: form.priority.value,
        expires_at: form.expires_at.value ? new Date(form.expires_at.value).toISOString() : null,
      };
      await NaviXApi.post("/api/announcements", payload);
      form.reset();
      load();
    });

    NaviXSocket.on("announcement", load);
    load();
  </script>
</body>
</html>
