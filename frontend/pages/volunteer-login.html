<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Volunteer Login – NaviX</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="navix-navbar"></div>

  <div class="container py-5" style="max-width:440px;">
    <div class="navix-card p-4">
      <h3 class="section-title mb-1">🧭 Volunteer Login</h3>
      <p class="text-navix-muted small mb-3">Sign in to view your assignments and update your status.</p>

      <form id="loginForm">
        <div class="mb-3">
          <label class="fw-bold mb-1">Username</label>
          <input name="username" required class="form-control" value="volunteer1" />
        </div>
        <div class="mb-3">
          <label class="fw-bold mb-1">Password</label>
          <input name="password" type="password" required class="form-control" value="volunteer123" />
        </div>
        <button type="submit" class="btn btn-navix-primary w-100">Login</button>
        <div id="loginError" class="text-danger small mt-2"></div>
      </form>
      <hr />
      <p class="text-navix-muted small mb-2">New volunteer?</p>
      <button id="showRegister" class="btn btn-navix-outline w-100">Register as Volunteer</button>

      <form id="registerForm" style="display:none;" class="mt-3">
        <div class="mb-2"><input name="name" required class="form-control" placeholder="Full name" /></div>
        <div class="mb-2"><input name="username" required class="form-control" placeholder="Choose a username" /></div>
        <div class="mb-2"><input name="password" type="password" required minlength="6" class="form-control" placeholder="Choose a password (min 6 chars)" /></div>
        <div class="mb-2"><input name="phone" class="form-control" placeholder="Phone number" /></div>
        <div class="mb-2"><input name="device_id" class="form-control" placeholder="Device ID (e.g. NVX-011, optional)" /></div>
        <button type="submit" class="btn btn-navix-primary w-100">Create Account</button>
        <div id="registerError" class="text-danger small mt-2"></div>
      </form>

      <p class="text-navix-muted small mt-3 mb-0">Demo login pre-filled: <code>volunteer1 / volunteer123</code></p>
    </div>
  </div>

  <div id="navix-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/geo.js"></script>
  <script src="/js/pwa-register.js"></script>
  <script>
    NaviXLayout.renderPublicNavbar("");
    NaviXLayout.renderFooter();

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        const tokenOut = await NaviXApi.post("/api/auth/login", { username: fd.get("username"), password: fd.get("password") });
        NaviXAuth.setSession(tokenOut);
        window.location.href = "/volunteer/dashboard";
      } catch (err) {
        document.getElementById("loginError").textContent = err.message;
      }
    });

    document.getElementById("showRegister").addEventListener("click", () => {
      document.getElementById("registerForm").style.display = "block";
      document.getElementById("showRegister").style.display = "none";
    });

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        const loc = await NaviXGeo.getCurrentPosition();
        const tokenOut = await NaviXApi.post("/api/auth/register", {
          name: fd.get("name"), username: fd.get("username"), password: fd.get("password"),
          phone: fd.get("phone") || null, device_id: fd.get("device_id") || null,
          role: "volunteer", latitude: loc.lat, longitude: loc.lon,
        });
        NaviXAuth.setSession(tokenOut);
        window.location.href = "/volunteer/dashboard";
      } catch (err) {
        document.getElementById("registerError").textContent = err.message;
      }
    });
  </script>
</body>
</html>
