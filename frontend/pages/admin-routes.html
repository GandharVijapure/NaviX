<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Routes – NaviX Control Room</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="admin-shell">
    <div id="navix-admin-sidebar"></div>
    <main class="admin-main">
      <div id="navix-admin-topbar"></div>

      <div class="row g-3">
        <div class="col-lg-5">
          <div class="navix-card p-3">
            <h6 class="fw-bold mb-3">Pre-stored Routes</h6>
            <div id="routeList" class="d-flex flex-column gap-2"></div>
            <button id="newRouteBtn" class="btn btn-navix-primary w-100 mt-3">➕ New Route</button>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="navix-card p-3">
            <h6 class="fw-bold mb-3" id="editorTitle">New Route</h6>
            <form id="routeForm">
              <input type="hidden" name="id" />
              <div class="row g-2 mb-2">
                <div class="col-12"><input name="name" required class="form-control" placeholder="Route name (e.g. Wari Route A)" /></div>
                <div class="col-6"><input name="source_label" class="form-control" placeholder="Source (e.g. Alandi Gate)" /></div>
                <div class="col-6"><input name="destination_label" class="form-control" placeholder="Destination (e.g. Main Ground)" /></div>
              </div>
              <div class="d-flex justify-content-between align-items-center mt-3 mb-2">
                <label class="fw-bold mb-0">Waypoints (in order)</label>
                <button type="button" id="addWaypointBtn" class="btn btn-sm btn-navix-outline" style="min-height:32px;">+ Add Waypoint</button>
              </div>
              <div id="waypointRows" class="d-flex flex-column gap-2 mb-3"></div>
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-navix-primary flex-grow-1">Save Route</button>
                <button type="button" id="deactivateBtn" class="btn btn-navix-outline" style="display:none;">Deactivate</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pwa-register.js"></script>
  <script>
    NaviXAuth.requireRole("admin", "/admin/login");
    NaviXLayout.renderAdminShell("/admin/routes", "Routes");

    let editingRouteId = null;

    function waypointRow(wp = {}) {
      const row = document.createElement("div");
      row.className = "border rounded p-2";
      row.innerHTML = `
        <div class="row g-2">
          <div class="col-3"><input type="number" step="any" class="form-control form-control-sm wp-lat" placeholder="Lat" value="${wp.latitude ?? ""}" /></div>
          <div class="col-3"><input type="number" step="any" class="form-control form-control-sm wp-lon" placeholder="Lon" value="${wp.longitude ?? ""}" /></div>
          <div class="col-3"><input class="form-control form-control-sm wp-instruction" placeholder="Instruction" value="${wp.instruction || ""}" /></div>
          <div class="col-2"><input class="form-control form-control-sm wp-landmark" placeholder="Landmark" value="${wp.landmark || ""}" /></div>
          <div class="col-1"><button type="button" class="btn btn-sm btn-outline-danger remove-wp-btn" style="min-height:31px;">✕</button></div>
        </div>`;
      row.querySelector(".remove-wp-btn").addEventListener("click", () => row.remove());
      return row;
    }

    document.getElementById("addWaypointBtn").addEventListener("click", () => {
      document.getElementById("waypointRows").appendChild(waypointRow());
    });

    function collectWaypoints() {
      return Array.from(document.querySelectorAll("#waypointRows > div")).map((row, i) => ({
        sequence: i + 1,
        latitude: parseFloat(row.querySelector(".wp-lat").value),
        longitude: parseFloat(row.querySelector(".wp-lon").value),
        instruction: row.querySelector(".wp-instruction").value || null,
        landmark: row.querySelector(".wp-landmark").value || null,
      })).filter((wp) => !isNaN(wp.latitude) && !isNaN(wp.longitude));
    }

    async function loadList() {
      const routes = await NaviXApi.get("/api/routes?active_only=false");
      document.getElementById("routeList").innerHTML = routes
        .map(
          (r) => `<button type="button" class="facility-card text-start border-0 w-100 route-item" data-id="${r.id}" style="cursor:pointer;">
            <div class="flex-grow-1">
              <div class="fw-bold">${r.name} ${r.active ? "" : '<span class="status-pill offline">inactive</span>'}</div>
              <div class="text-navix-muted small">v${r.version} · ${r.waypoint_count} waypoints</div>
            </div>
          </button>`
        )
        .join("") || `<p class="text-navix-muted small">No routes yet.</p>`;

      document.querySelectorAll(".route-item").forEach((btn) =>
        btn.addEventListener("click", () => loadIntoEditor(Number(btn.getAttribute("data-id"))))
      );
    }

    async function loadIntoEditor(routeId) {
      const route = await NaviXApi.get(`/api/routes/${routeId}`);
      editingRouteId = route.id;
      const form = document.getElementById("routeForm");
      form.id.value = route.id;
      form.name.value = route.name;
      form.source_label.value = route.source_label || "";
      form.destination_label.value = route.destination_label || "";
      document.getElementById("waypointRows").innerHTML = "";
      route.waypoints.forEach((wp) => document.getElementById("waypointRows").appendChild(waypointRow(wp)));
      document.getElementById("editorTitle").textContent = `Edit "${route.name}" (v${route.version})`;
      document.getElementById("deactivateBtn").style.display = "inline-block";
    }

    document.getElementById("newRouteBtn").addEventListener("click", () => {
      editingRouteId = null;
      document.getElementById("routeForm").reset();
      document.getElementById("waypointRows").innerHTML = "";
      document.getElementById("editorTitle").textContent = "New Route";
      document.getElementById("deactivateBtn").style.display = "none";
    });

    document.getElementById("routeForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const payload = {
        name: form.name.value,
        source_label: form.source_label.value || null,
        destination_label: form.destination_label.value || null,
        waypoints: collectWaypoints(),
      };
      if (editingRouteId) {
        await NaviXApi.put(`/api/routes/${editingRouteId}`, payload);
      } else {
        await NaviXApi.post("/api/routes", payload);
      }
      await loadList();
    });

    document.getElementById("deactivateBtn").addEventListener("click", async () => {
      if (!editingRouteId) return;
      await NaviXApi.put(`/api/routes/${editingRouteId}`, { active: false });
      await loadList();
    });

    loadList();
  </script>
</body>
</html>
