<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Devices – NaviX Control Room</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="admin-shell">
    <div id="navix-admin-sidebar"></div>
    <main class="admin-main">
      <div id="navix-admin-topbar"></div>
      <div class="navix-card p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="fw-bold mb-0">LoRa / ESP32 Devices</h6>
          <a href="/developer/device-simulator" class="btn btn-sm btn-navix-outline" style="min-height:36px;">🛠️ Open Hardware Simulator</a>
        </div>
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead><tr><th>Device ID</th><th>Linked Volunteer</th><th>Status</th><th>Battery</th><th>Last Seen</th><th>Location</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/pwa-register.js"></script>
  <script>
    NaviXAuth.requireRole("admin", "/admin/login");
    NaviXLayout.renderAdminShell("/admin/devices", "Devices");

    async function load() {
      const [devices, volunteers] = await Promise.all([NaviXApi.get("/api/device"), NaviXApi.get("/api/volunteers")]);
      const volunteerById = Object.fromEntries(volunteers.map((v) => [v.id, v]));
      document.getElementById("rows").innerHTML = devices
        .map((d) => {
          const linked = d.volunteer_id ? volunteerById[d.volunteer_id] : null;
          const secondsAgo = (Date.now() - new Date(d.last_seen + "Z")) / 1000;
          const isStale = secondsAgo > 30;
          return `<tr>
            <td>${d.device_id}</td>
            <td>${linked ? linked.name : "—"}</td>
            <td><span class="status-pill ${isStale ? "offline" : d.status}">${isStale ? "stale" : d.status}</span></td>
            <td>${d.battery}%</td>
            <td>${new Date(d.last_seen + "Z").toLocaleTimeString()}</td>
            <td class="small text-navix-muted">${d.latitude != null ? d.latitude.toFixed(4) + ", " + d.longitude.toFixed(4) : "—"}</td>
          </tr>`;
        })
        .join("");
    }

    NaviXSocket.on("device_update", load);
    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
