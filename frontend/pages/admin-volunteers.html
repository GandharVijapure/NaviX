<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Volunteers – NaviX Control Room</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="admin-shell">
    <div id="navix-admin-sidebar"></div>
    <main class="admin-main">
      <div id="navix-admin-topbar"></div>
      <div class="navix-card p-3">
        <h6 class="fw-bold mb-3">Volunteer Roster</h6>
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead><tr><th>Name</th><th>Device</th><th>Zone</th><th>Status</th><th>Battery</th><th>Last Seen</th><th>Location</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/pwa-register.js"></script>
  <script>
    NaviXAuth.requireRole("admin", "/admin/login");
    NaviXLayout.renderAdminShell("/admin/volunteers", "Volunteers");

    const STATUSES = ["available", "responding", "busy", "offline"];

    async function load() {
      const volunteers = await NaviXApi.get("/api/volunteers");
      document.getElementById("rows").innerHTML = volunteers
        .map((v) => {
          const opts = STATUSES.map((s) => `<option value="${s}" ${s === v.status ? "selected" : ""}>${s}</option>`).join("");
          return `<tr>
            <td>${v.name}</td>
            <td>${v.device_id || "—"}</td>
            <td>${v.assigned_zone || "—"}</td>
            <td><select class="form-select form-select-sm status-select" data-id="${v.id}" style="min-height:34px; width:140px;">${opts}</select></td>
            <td>${v.battery_level}%</td>
            <td>${new Date(v.last_seen + "Z").toLocaleTimeString()}</td>
            <td class="small text-navix-muted">${v.latitude.toFixed(4)}, ${v.longitude.toFixed(4)}</td>
          </tr>`;
        })
        .join("");

      document.querySelectorAll(".status-select").forEach((sel) => {
        sel.addEventListener("change", async () => {
          await NaviXApi.put(`/api/volunteers/${sel.getAttribute("data-id")}/status`, { status: sel.value });
        });
      });
    }

    NaviXSocket.on("volunteer_update", load);
    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
